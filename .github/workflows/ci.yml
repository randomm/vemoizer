# CI for vemoizer (issue #102).
#
# Single job on a pinned macos-15 runner (macos-15 is Apple Silicon / arm64;
# the MLX stack has no Intel path, so macos-15-intel must not be used).
#
# The four quality gates from AGENTS.md run as four separate named steps so a
# failure names the gate:
#   1. uv run pytest tests/
#   2. uv run ruff check src/ tests/
#   3. uv run ty check src/ tests/
#   4. uv run ruff format --check src/ tests/
#
# Not run in CI: the WER regression gate (`vemoizer eval`) and any
# `pytest -m models` test — both need real model weights and stay local-only
# (see AGENTS.md). HF_HUB_OFFLINE=1 makes any accidental model access fail
# fast instead of downloading multi-GB weights.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates (macos-15, arm64)
    runs-on: macos-15 # pinned; macos-15 is Apple Silicon. Do NOT switch to macos-15-intel.
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # The fixture-based ingest tests (tests/test_ingest.py) shell out to real
      # ffmpeg; it is the only non-Python system dependency. GitHub-hosted
      # macos-15 runners may already include ffmpeg, so install only if absent.
      - name: Install ffmpeg
        run: brew list ffmpeg > /dev/null 2>&1 || brew install ffmpeg

      - name: pytest
        run: uv run pytest tests/

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ty check
        run: uv run ty check src/ tests/

      - name: ruff format check
        run: uv run ruff format --check src/ tests/
