[project]
name = "vemoizer"
version = "0.1.0"
description = "Local-first CLI: Finnish/English code-switched voice memos to text and Markdown via a consensus ASR pipeline."
requires-python = ">=3.11"
dependencies = [
    "silero-vad==6.2.1",
    "onnxruntime==1.29.0",
    "numpy",
    "soundfile==0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vemoizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: model-backed tests that download real weights; opt-in via `uv run pytest -m models` (AGENTS.md: unit tests must not touch the network)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"
