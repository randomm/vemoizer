[project]
name = "vemoizer"
version = "0.1.0"
description = "Local-first CLI that turns voice memos into text and Markdown"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "ty==0.0.73",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vemoizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
